<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesion | Netflix Delfin</title>
  <link rel="stylesheet" href="netflix-delfin.css" />
</head>
<body>
  <header class="main-header login-header">
    <div class="overlay"></div>
    <nav class="navbar container">
      <h1 class="logo">NETFLIX</h1>
      <a class="btn-login" href="Netflix-Delfin.html">Volver</a>
    </nav>

    <div class="container login-wrap">
      <form class="login-panel" action="login.php" method="POST" name="formulario">
        <h2>Iniciar sesion</h2>
        <p>Entra con tus datos para continuar.</p>

        <label for="usuario">Usuario</label>
        <input id="usuario" type="text" name="usuario" required />

        <label for="contrasena">Contrasena</label>
        <input id="contrasena" type="password" name="contrasena" required />

        <button class="btn-cta" type="submit">Acceder</button>
      </form>
    </div>
  </header>
</body>
</html>
